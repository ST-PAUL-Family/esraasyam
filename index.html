<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esraa Syam | Beauty Center & Atelier</title>
<meta name="description" content="Esraa Syam Beauty Center & Atelier - Follow us and get in touch.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&family=Great+Vibes&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   THEME — everything is driven by ONE number: --h (hue).
   The script animates --h, so the whole frame re-colors smoothly.
   ========================================================= */
:root{
  --h:32;
  --ink:#1d3438;
  --ink-soft:#4b6266;
  --card:#f8efe5;
  --card-2:#f0e3d4;
  --sage:#9fb1ac;
  --sage-dark:#7d918d;
  --stripe:rgba(40,60,60,.30);

  --accent:hsl(var(--h) 52% 54%);            /* thin lines, arrows, borders */
  --accent-soft:hsl(var(--h) 52% 54% / .5);
  --glow:hsl(var(--h) 100% 70% / .85);
  --glow-2:hsl(var(--h) 100% 62% / .45);
  --frame-a:hsl(var(--h) 90% 95%);
  --frame-b:hsl(var(--h) 72% 80%);
  --btn-bg:rgba(255,255,255,.62);
  --tb-bg:rgba(255,255,255,.72);
  --pal-bg:rgba(255,255,255,.94);
  --card-hi:rgba(255,255,255,.55);
  --cone-a:.8;
  --text-glow:none;
  --ease-out:cubic-bezier(.22,.9,.3,1);
  --ease-spring:cubic-bezier(.3,1.4,.5,1);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh;min-height:100dvh;
  font-family:'Montserrat',sans-serif;color:var(--ink);
  display:flex;justify-content:center;align-items:flex-start;
  padding:26px 14px 44px;
  background:
    repeating-linear-gradient(90deg,var(--stripe) 0 3px,transparent 3px 26px),
    linear-gradient(180deg,var(--sage) 0%,var(--sage-dark) 100%);
  overflow-x:hidden;
}
body.ar{font-family:'Cairo','Montserrat',sans-serif}
button{font:inherit;color:inherit}

/* marble veins */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;z-index:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600' viewBox='0 0 600 600' fill='none' stroke='%23f1c9b0' stroke-width='1.6' stroke-linecap='round'><path d='M40 0 C90 90 40 160 120 230 S190 330 150 420 S230 520 210 600'/><path d='M120 230 C180 220 210 250 260 240'/><path d='M150 420 C100 450 90 500 40 520'/><path d='M420 0 C380 80 470 140 440 230 S500 330 540 400 S520 520 600 560'/><path d='M440 230 C500 250 520 220 590 240'/><path d='M330 320 C370 340 380 390 350 430'/></svg>");
  background-size:600px 600px;
}

/* =========================================================
   LIGHT ON / OFF  (class "on" on <body>)
   .lit      -> visible when the lamp is ON
   .lit-inv  -> visible when the lamp is OFF
   Only opacity is animated => buttery smooth (GPU).
   ========================================================= */
.lit,.lit-inv{transition:opacity .85s ease;will-change:opacity}
.lit{opacity:0}
.lit-inv{opacity:1}
body.on .lit{opacity:1}
body.on .lit-inv{opacity:0}
body.fast .lit,body.fast .lit-inv{transition-duration:.07s}

.room{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 18%,rgba(4,8,12,.30),rgba(4,8,12,.9))}

/* =========================================================
   FRAME
   ========================================================= */
.frame-wrap{
  position:relative;z-index:1;width:100%;max-width:460px;
  transition:opacity 1s ease,transform 1.1s var(--ease-out);
}
body.boot:not(.in) .frame-wrap{opacity:0;transform:translateY(30px) scale(.94)}

.frame-glow{
  position:absolute;inset:0;border-radius:6px;pointer-events:none;
  box-shadow:0 0 0 2px hsl(var(--h) 100% 92%),0 0 26px 5px var(--glow),0 0 86px 24px var(--glow-2);
  animation:glowPulse 3.6s ease-in-out infinite alternate;
}
.frame{
  position:relative;z-index:1;overflow:hidden;
  padding:14px;border-radius:6px;
  background:linear-gradient(145deg,var(--frame-a),var(--frame-b));
  box-shadow:0 22px 50px rgba(0,0,0,.28);
}
.frame-dim{position:absolute;inset:0;z-index:1;pointer-events:none;background:rgba(8,14,18,.55)}

/* running light that circles the frame */
.chase{
  position:absolute;left:50%;top:50%;width:1800px;height:1800px;margin:-900px 0 0 -900px;
  z-index:0;pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0 52%,hsl(var(--h) 100% 72% / .25) 62%,hsl(var(--h) 100% 66%) 82%,#fff 89%,hsl(var(--h) 100% 66%) 93%,transparent 100%);
  animation:spin 5.5s linear infinite;will-change:transform;
}
/* ripple when the color changes */
.wave{
  position:absolute;left:50%;top:80px;width:60px;height:60px;margin:-30px 0 0 -30px;z-index:3;pointer-events:none;
  border-radius:50%;opacity:0;transform:scale(0);
  background:radial-gradient(circle,hsl(var(--h) 100% 80% / .95),hsl(var(--h) 100% 65% / .45) 45%,transparent 70%);
}
.wave.go{animation:wave 1.15s ease-out}

.panel{
  position:relative;z-index:2;isolation:isolate;overflow:hidden;border-radius:4px;padding:0 0 28px;
  background:
    repeating-linear-gradient(90deg,var(--stripe) 0 3px,transparent 3px 26px),
    linear-gradient(180deg,var(--sage) 0%,var(--sage-dark) 100%);
}
.panel-glow{position:absolute;inset:0;z-index:1;pointer-events:none;
  box-shadow:inset 0 0 50px hsl(var(--h) 100% 82% / .55),inset 0 0 110px hsl(var(--h) 100% 70% / .25)}
.panel-dim{position:absolute;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(ellipse 75% 38% at 50% 8%,rgba(6,12,16,.16),rgba(6,12,16,.6) 75%)}

/* floating light dust */
.sparks{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.sparks i{
  position:absolute;bottom:-10px;border-radius:50%;
  background:hsl(var(--h) 100% 82%);box-shadow:0 0 8px 2px hsl(var(--h) 100% 70% / .8);
  animation:floatUp linear infinite;opacity:0;
}

/* =========================================================
   TOOLBAR
   ========================================================= */
.toolbar{position:absolute;top:12px;inset-inline:12px;z-index:8;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.toolbar>*{pointer-events:auto}
.tbtn{
  font:600 12px 'Montserrat',sans-serif;letter-spacing:.1em;color:var(--ink);
  background:var(--tb-bg);border:1px solid var(--accent-soft);
  border-radius:999px;padding:8px 13px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;
  transition:transform .3s var(--ease-out),box-shadow .3s,border-color .6s;
  -webkit-tap-highlight-color:transparent;
}
body.ar .tbtn{font-family:'Cairo',sans-serif;letter-spacing:0;font-size:13px}
.tbtn:hover{transform:translateY(-2px);box-shadow:0 0 16px var(--glow)}
.tbtn:active{transform:scale(.95)}
.tbtn svg{width:15px;height:15px}
.dot{width:14px;height:14px;border-radius:50%;background:hsl(var(--h) 100% 62%);box-shadow:0 0 10px hsl(var(--h) 100% 62%)}

.pal-wrap{position:relative}
.palette{
  position:absolute;top:calc(100% + 9px);inset-inline-end:0;display:flex;gap:7px;padding:9px 10px;
  border-radius:999px;background:var(--pal-bg);border:1px solid var(--accent-soft);
  box-shadow:0 12px 28px rgba(0,0,0,.25);
  transform-origin:top right;transform:translateY(-8px) scale(.6);opacity:0;pointer-events:none;
  transition:transform .4s var(--ease-spring),opacity .25s;
}
[dir="rtl"] .palette{transform-origin:top left}
.palette.open{transform:none;opacity:1;pointer-events:auto}
.sw{width:23px;height:23px;border-radius:50%;border:2px solid #fff;cursor:pointer;
  background:hsl(var(--c) 100% 62%);box-shadow:0 0 0 1px rgba(0,0,0,.12);
  transition:transform .25s var(--ease-spring),box-shadow .25s;-webkit-tap-highlight-color:transparent}
.sw:hover{transform:scale(1.2)}
.sw.active{box-shadow:0 0 0 2px var(--ink),0 0 12px hsl(var(--c) 100% 62%)}

.tools-right{display:flex;gap:8px;align-items:flex-start}
.ic-sun{display:none}
body.night .ic-sun{display:block}
body.night .ic-moon{display:none}
.veil{position:fixed;inset:0;z-index:60;background:#0a1013;opacity:0;pointer-events:none;transition:opacity .26s ease}
.veil.show{opacity:.88}
@media (max-width:430px){#themeLabel,#colorLabel{display:none}.tbtn{padding:8px 11px}}

/* =========================================================
   NIGHT MODE (default) — glowing sign look
   ========================================================= */
body.night{
  --ink:#fff3e3;--ink-soft:#e8cfb2;
  --card:#1b2326;--card-2:#222d31;
  --sage:#2c3a40;--sage-dark:#1a2428;--stripe:rgba(0,0,0,.55);
  --accent:hsl(var(--h) 100% 68%);
  --accent-soft:hsl(var(--h) 100% 68% / .6);
  --glow:hsl(var(--h) 100% 62% / .95);
  --glow-2:hsl(var(--h) 100% 55% / .55);
  --frame-a:hsl(var(--h) 100% 86%);
  --frame-b:hsl(var(--h) 90% 56%);
  --btn-bg:rgba(255,255,255,.05);
  --tb-bg:rgba(18,26,30,.8);
  --pal-bg:rgba(18,26,30,.95);
  --card-hi:rgba(255,255,255,.06);
  --cone-a:.42;
  --text-glow:0 0 8px hsl(var(--h) 100% 62% / .9),0 0 22px hsl(var(--h) 100% 55% / .55);
}
body.night::before{opacity:.3;filter:drop-shadow(0 0 3px hsl(var(--h) 100% 60% / .8))}
body.night .card{box-shadow:0 0 50px hsl(var(--h) 100% 55% / .22),inset 0 0 0 4px rgba(255,255,255,.04)}
body.night .leaf{opacity:.22;color:var(--accent)}
body.night .heart{color:var(--accent);filter:drop-shadow(0 0 8px var(--glow))}
body.night .sw{border-color:#1b2326}
body.night .logo-img{filter:drop-shadow(0 0 10px hsl(var(--h) 100% 62% / .9)) drop-shadow(0 0 24px hsl(var(--h) 100% 55% / .6)) brightness(1.06)}

/* =========================================================
   LAMP
   ========================================================= */
.lamp{position:relative;height:134px;display:flex;justify-content:center;z-index:7;pointer-events:none}
.drop{transition:transform 1.15s var(--ease-spring)}
body.boot:not(.in) .drop{transform:translateY(-160px)}
.lampbtn{pointer-events:auto;background:none;border:0;cursor:pointer;padding:0 26px;height:112px;display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
.lampbtn:focus-visible{outline:2px dashed var(--accent);outline-offset:4px;border-radius:10px}
.swing{position:relative;display:flex;flex-direction:column;align-items:center;transform-origin:50% 0}
.swing.sway{animation:sway 2.6s ease-out}
.cord{width:2px;height:44px;background:linear-gradient(#a9743a,#f0c493)}
.shade{
  width:50px;height:32px;clip-path:polygon(22% 0,78% 0,100% 100%,0 100%);
  background:linear-gradient(90deg,#8a5a24,#e9b97c 38%,#fff0cf 55%,#b97b3d);
}
.bulb{position:relative;width:24px;height:10px;border-radius:0 0 14px 14px;background:#6a6157;margin-top:-1px}
.bulb .core{position:absolute;inset:0;border-radius:inherit;background:#fff8e1;box-shadow:0 0 14px 4px hsl(var(--h) 100% 80% / .9)}
.bulb .halo-l{position:absolute;left:50%;top:-8px;width:150px;height:150px;margin-left:-75px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,hsl(var(--h) 100% 82% / .85),hsl(var(--h) 100% 66% / .32) 38%,transparent 66%)}
.pull{position:absolute;top:56px;left:calc(50% + 15px);width:1px;height:24px;background:#c98d57;transform-origin:top}
.pull::after{content:"";position:absolute;left:-2.5px;bottom:-5px;width:6px;height:6px;border-radius:50%;background:#e9b97c;box-shadow:0 0 6px var(--glow)}
.pull.tug{animation:tug .45s var(--ease-out)}

.cone{
  position:absolute;top:100px;left:50%;width:340px;height:330px;margin-left:-170px;z-index:-1;pointer-events:none;
  clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);
  background:linear-gradient(180deg,hsl(var(--h) 100% 90% / var(--cone-a)),hsl(var(--h) 100% 78% / calc(var(--cone-a) * .28)) 55%,transparent);
  transform-origin:50% 0;animation:breathe 4s ease-in-out infinite alternate;
}

/* =========================================================
   CARD
   ========================================================= */
.card{
  position:relative;z-index:2;margin:-6px 18px 0;padding:44px 22px 24px;text-align:center;
  background:radial-gradient(circle at 20% 10%,var(--card-hi),transparent 55%),linear-gradient(180deg,var(--card),var(--card-2));
  border:2px solid var(--accent);border-radius:90px 4px 4px 4px / 40px 4px 4px 4px;
  box-shadow:0 16px 40px rgba(40,25,10,.25),inset 0 0 0 4px rgba(255,255,255,.18);
  transition:opacity .22s ease,transform .22s ease,border-color .3s;
}
.card::before{content:"";position:absolute;inset:6px;border:1px solid var(--accent);opacity:.45;border-top-left-radius:84px 36px;pointer-events:none}
.card.swap{opacity:0;transform:translateY(8px)}

.leaf{position:absolute;opacity:.15;width:150px;pointer-events:none;color:#3b4f52}
.leaf.r{right:-14px;top:70px;transform-origin:50% 100%;animation:leafR 7s ease-in-out infinite alternate}
.leaf.l{left:-22px;bottom:110px;width:120px;transform-origin:50% 100%;animation:leafL 8s ease-in-out infinite alternate}

/* logo */
.monogram{position:relative;display:inline-flex;align-items:center;justify-content:center;width:178px;height:156px;margin-bottom:2px;font-family:'Playfair Display',serif}
.monogram .halo{position:absolute;inset:-35%;pointer-events:none;background:radial-gradient(circle,hsl(var(--h) 100% 78% / .6),transparent 62%)}
#logoImgs{position:relative;width:100%;height:100%;display:block}
#logoImgs img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.logo-img{filter:drop-shadow(0 6px 10px rgba(90,50,10,.35));animation:bob 6s ease-in-out infinite}
.shine-img{
  filter:brightness(2.6) contrast(.85);
  -webkit-mask-image:linear-gradient(110deg,transparent 40%,#000 50%,transparent 60%);
          mask-image:linear-gradient(110deg,transparent 40%,#000 50%,transparent 60%);
  -webkit-mask-size:300% 100%;mask-size:300% 100%;
  animation:shine 5.5s ease-in-out infinite,bob 6s ease-in-out infinite;
}
.fallback-mono{display:flex;align-items:center;justify-content:center;height:100%}
.fallback-mono .e,.fallback-mono .s{background:linear-gradient(135deg,#8a5a24,#d9a35c 30%,#fff1c9 50%,#c98d57 70%,#7a4d1d);-webkit-background-clip:text;background-clip:text;color:transparent}
.fallback-mono .e{font-size:92px;transform:translateX(8px)}
.fallback-mono .s{font-size:80px;font-style:italic;transform:translate(-18px,16px)}

h1{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(34px,9vw,44px);line-height:1.05;text-shadow:var(--text-glow)}
body.ar h1{font-family:'Cairo',sans-serif;font-weight:700}
.sub{margin-top:8px;font-size:13px;letter-spacing:.34em;font-weight:500;text-shadow:var(--text-glow)}
body.ar .sub{letter-spacing:.08em;font-size:14px}
.amp{display:block;color:var(--accent);margin-top:2px;font-size:15px}
.atelier{text-shadow:var(--text-glow);font-family:'Great Vibes',cursive;font-size:44px;line-height:1.1;display:flex;align-items:center;justify-content:center;gap:12px}
body.ar .atelier{font-family:'Cairo',sans-serif;font-size:32px;font-weight:600}
.atelier::before,.atelier::after{content:"";height:2px;width:38px;background:var(--accent);box-shadow:0 0 8px var(--glow)}
.divider{margin:18px auto 14px;width:60%;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.hello{font-size:13px;color:var(--ink-soft);margin-bottom:16px;letter-spacing:.04em}
body.ar .hello{font-size:14px}

/* link cards */
.links{display:grid;gap:13px}
.link{
  position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:16px;
  text-decoration:none;color:var(--ink);text-align:start;
  background:var(--btn-bg);border:1px solid var(--accent-soft);
  transition:transform .35s var(--ease-out),box-shadow .35s,border-color .35s;
  -webkit-tap-highlight-color:transparent;
}
.link::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(110deg,transparent 32%,rgba(255,255,255,.65) 50%,transparent 68%);
  transform:translateX(-130%);transition:transform .8s var(--ease-out)}
.link:hover,.link:focus-visible{transform:translateY(-4px) scale(1.015);outline:none;border-color:var(--accent);box-shadow:0 12px 26px rgba(90,55,15,.22),0 0 22px var(--glow)}
.link:hover::after,.link:focus-visible::after{transform:translateX(130%)}
.link:active{transform:scale(.975);transition-duration:.12s}
.link .ico{flex:0 0 66px;width:66px;height:66px;border-radius:18px;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.25);transition:transform .45s var(--ease-spring)}
.link:hover .ico{transform:rotate(-7deg) scale(1.1)}
.link .ico svg,.link .ico img{width:100%;height:100%;display:block;object-fit:cover}
.link .txt{flex:1;min-width:0}
.link .name{font-weight:600;font-size:17px;letter-spacing:.03em}
body.ar .link .name{font-size:18px}
.link .desc{font-size:12px;color:var(--ink-soft);margin-top:3px}
body.ar .link .desc{font-size:13px}
.link .arrow{width:22px;height:22px;color:var(--accent);transition:transform .35s var(--ease-out)}
.link:hover .arrow{transform:translateX(6px)}
[dir="rtl"] .link .arrow{transform:scaleX(-1)}
[dir="rtl"] .link:hover .arrow{transform:scaleX(-1) translateX(6px)}

.tagline{margin-top:24px;font-family:'Great Vibes',cursive;font-size:30px;line-height:1.15;text-shadow:var(--text-glow)}
body.ar .tagline{font-family:'Cairo',sans-serif;font-size:20px;font-weight:600}
.heart{display:block;margin:8px auto 0;width:22px;color:hsl(var(--h) 45% 28%);animation:beat 1.9s ease-in-out infinite}
.foot{margin-top:18px;font-size:11px;letter-spacing:.2em;color:var(--ink-soft)}
body.ar .foot{letter-spacing:.05em}

/* intro reveal: hidden while booting, then cascades in */
body.boot:not(.ready) .reveal{opacity:0;transform:translateY(24px)}
body.ready .reveal{animation:rise .9s var(--ease-out) backwards;animation-delay:calc(var(--i,0) * 80ms)}

/* =========================================================
   KEYFRAMES (transform / opacity only)
   ========================================================= */
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glowPulse{from{transform:scale(1)}to{transform:scale(1.012)}}
@keyframes breathe{from{transform:scaleY(.95)}to{transform:scaleY(1.05)}}
@keyframes sway{0%{transform:rotate(0)}18%{transform:rotate(9deg)}38%{transform:rotate(-6.5deg)}58%{transform:rotate(3.8deg)}76%{transform:rotate(-1.8deg)}90%{transform:rotate(.7deg)}100%{transform:rotate(0)}}
@keyframes tug{0%{transform:scaleY(1)}35%{transform:scaleY(1.45)}100%{transform:scaleY(1)}}
@keyframes wave{0%{opacity:.95;transform:scale(0)}100%{opacity:0;transform:scale(34)}}
@keyframes floatUp{0%{transform:translate3d(0,0,0);opacity:0}12%{opacity:.95}100%{transform:translate3d(var(--dx),-560px,0);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes shine{0%,55%{-webkit-mask-position:150% 0;mask-position:150% 0}100%{-webkit-mask-position:-50% 0;mask-position:-50% 0}}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.22)}28%{transform:scale(1)}42%{transform:scale(1.14)}60%{transform:scale(1)}}
@keyframes leafR{from{transform:rotate(-2.5deg)}to{transform:rotate(3deg)}}
@keyframes leafL{from{transform:scaleX(-1) rotate(-17deg)}to{transform:scaleX(-1) rotate(-11deg)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01s!important}
  body.boot:not(.ready) .reveal{opacity:1;transform:none}
}
</style>
</head>

<body class="boot night" dir="ltr">
<div class="room lit-inv"></div>
<div class="veil" id="veil"></div>

<div class="frame-wrap">
  <div class="frame-glow lit"></div>

  <div class="frame">
    <div class="chase lit"></div>
    <div class="frame-dim lit-inv"></div>
    <div class="wave" id="wave"></div>

    <div class="panel">
      <div class="panel-glow lit"></div>
      <div class="sparks lit" id="sparks"></div>

      <div class="toolbar reveal" style="--i:0">
        <button class="tbtn" id="langBtn" aria-label="Change language">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>
          <span id="langLabel">العربية</span>
        </button>

        <div class="tools-right">
          <button class="tbtn" id="themeBtn" aria-label="Day / Night mode">
            <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <span id="themeLabel">Day light</span>

        <svg class="leaf l" viewBox="0 0 120 300" fill="currentColor"><path d="M60 300C58 200 62 100 70 0" stroke="currentColor" fill="none" stroke-width="2"/><path d="M62 40c30-10 50-30 54-38-30 0-52 14-54 38zM64 90c-28-6-52-22-58-34 30-2 54 12 58 34zM62 140c32-8 52-28 56-40-32 0-54 16-56 40zM60 190c-30-6-54-22-58-34 30-4 54 10 58 34z"/></svg>

        <div class="monogram reveal" style="--i:3">

        <h1 class="reveal" style="--i:4" data-i18n="name">Esraa Syam</h1>

<script>
/* =====================================================================

const LOGO_SRC = "assets/logo.png";   // your gold ES logo (leave empty "" to use the text monogram)

const LINKS = [

/* ===================================================================== */

/* ----- App icons (built-in SVGs). You can override any of them with your own image via "icon" above ----- */
const ICONS = {
  facebook:`<svg viewBox="0 0 64 64"><rect width="64" height="64" fill="#1877F2"/><path fill="#fff" d="M43.500 40l1.500-9.800h-9.400v-6.300c0-2.700 1.300-5.300 5.500-5.300h4.300v-8.400s-3.900-.7-7.600-.7c-7.700 0-12.800 4.700-12.800 13.200v7.500h-8.600V40h8.600v24h10.500V40z"/></svg>`,
  tiktok:`<svg viewBox="0 0 64 64"><rect width="64" height="64" fill="#010101"/><g transform="translate(14 13) scale(1.5)"><path fill="#25F4EE" transform="translate(-.9 -.9)" d="M12.525.02c1.310-.02 2.610-.01 3.910-.02.080 1.530.630 3.090 1.750 4.170 1.120 1.110 2.700 1.620 4.240 1.790v4.030c-1.440-.05-2.890-.35-4.200-.97-.57-.26-1.100-.59-1.620-.93-.01 2.920.01 5.840-.02 8.750-.08 1.400-.54 2.790-1.350 3.940-1.310 1.920-3.580 3.170-5.910 3.210-1.430.08-2.860-.31-4.080-1.030-2.020-1.190-3.440-3.370-3.650-5.710-.02-.5-.03-1-.01-1.490.18-1.900 1.120-3.720 2.580-4.960 1.660-1.440 3.980-2.130 6.150-1.720.02 1.480-.04 2.960-.04 4.440-.99-.32-2.150-.23-3.020.37-.63.41-1.110 1.040-1.360 1.750-.21.51-.15 1.070-.14 1.610.24 1.640 1.820 3.020 3.500 2.870 1.120-.01 2.190-.66 2.770-1.610.19-.33.4-.67.41-1.060.1-1.790.06-3.570.07-5.360.01-4.030-.01-8.050.02-12.070z"/><path fill="#FE2C55" transform="translate(.9 .9)" d="M12.525.02c1.310-.02 2.610-.01 3.910-.02.080 1.530.630 3.090 1.750 4.170 1.120 1.110 2.700 1.620 4.240 1.790v4.030c-1.440-.05-2.890-.35-4.200-.97-.57-.26-1.100-.59-1.620-.93-.01 2.920.01 5.840-.02 8.750-.08 1.400-.54 2.790-1.350 3.940-1.310 1.920-3.580 3.170-5.910 3.210-1.430.08-2.860-.31-4.080-1.030-2.020-1.190-3.440-3.370-3.650-5.710-.02-.5-.03-1-.01-1.490.18-1.900 1.120-3.720 2.580-4.960 1.660-1.440 3.980-2.130 6.150-1.720.02 1.480-.04 2.960-.04 4.440-.99-.32-2.150-.23-3.020.37-.63.41-1.110 1.040-1.360 1.750-.21.51-.15 1.070-.14 1.610.24 1.640 1.820 3.020 3.500 2.870 1.120-.01 2.190-.66 2.770-1.610.19-.33.4-.67.41-1.060.1-1.790.06-3.570.07-5.360.01-4.030-.01-8.050.02-12.070z"/><path fill="#fff" d="M12.525.02c1.310-.02 2.610-.01 3.910-.02.080 1.530.630 3.090 1.750 4.170 1.120 1.110 2.700 1.620 4.240 1.790v4.030c-1.440-.05-2.890-.35-4.200-.97-.57-.26-1.100-.59-1.620-.93-.01 2.920.01 5.840-.02 8.750-.08 1.400-.54 2.790-1.350 3.940-1.310 1.920-3.580 3.170-5.910 3.210-1.430.08-2.860-.31-4.080-1.030-2.020-1.190-3.440-3.370-3.650-5.710-.02-.5-.03-1-.01-1.490.18-1.900 1.120-3.720 2.580-4.960 1.660-1.440 3.980-2.130 6.150-1.720.02 1.480-.04 2.960-.04 4.440-.99-.32-2.150-.23-3.020.37-.63.41-1.110 1.040-1.360 1.750-.21.51-.15 1.070-.14 1.610.24 1.640 1.820 3.020 3.500 2.870 1.120-.01 2.190-.66 2.770-1.610.19-.33.4-.67.41-1.060.1-1.790.06-3.570.07-5.360.01-4.030-.01-8.050.02-12.070z"/></g></svg>`,
  whatsapp:`<svg viewBox="0 0 64 64"><rect width="64" height="64" fill="#25D366"/><path d="M32 12a19 19 0 0 0-16.200 28.900L13 51l10.500-2.700A19 19 0 1 0 32 12z" fill="none" stroke="#fff" stroke-width="3.500" stroke-linejoin="round"/><path fill="#fff" d="M25.200 22.500c.5-.8 1.500-.8 2 0l1.800 3.300c.3.500.3 1.100 0 1.600l-1.300 1.600c1.500 3 3.800 5.300 6.800 6.800l1.600-1.300c.5-.4 1.100-.4 1.600 0l3.300 1.800c.8.500.8 1.500 0 2.100-1.800 2-4.400 2.800-6.900 1.800-5.300-2-9.300-6-11.300-11.300-1-2.500-.2-5.100 1.800-6.900z"/></svg>`,
  vodafone:`<svg viewBox="0 0 64 64"><rect width="64" height="64" fill="#E60000"/><circle cx="32" cy="27" r="14" fill="#fff"/><circle cx="33" cy="28.500" r="8" fill="#E60000"/><path fill="#E60000" d="M20 33c-1 6 2 11 8 12-4-3-6-7-5-12z"/><text x="32" y="58" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-weight="700" font-size="11" fill="#fff">cash</text></svg>`,
  instapay:`<svg viewBox="0 0 64 64"><defs><linearGradient id="ip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a1b9a"/><stop offset="1" stop-color="#c2185b"/></linearGradient></defs><rect width="64" height="64" fill="url(#ip)"/><circle cx="32" cy="26" r="13" fill="#fff"/><path fill="#8e24aa" d="M34.500 15 24 29h7l-2 10 11-15h-7z"/><text x="32" y="55" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-weight="700" font-size="11" fill="#fff">InstaPay</text></svg>`
};

/* ----- Translations ----- */
const I18N = {
  en: {
    name:"Esraa Syam", beauty:"BEAUTY CENTER", atelier:"Atelier",
    hello:"Follow us & get in touch — tap any icon",
    tagline:"Your beauty,<br>our priority",
    lang:"العربية", color:"Light color", light:["Night glow","Day light"],
    facebook:["Facebook","Follow our page"], tiktok:["TikTok","Watch our videos"],
    whatsapp:["WhatsApp Group","Join our community"], vodafone:["Vodafone Cash","Send payment easily"],
    instapay:["InstaPay","Instant payment"]
  },
  ar: {
    name:"إسراء سيام", beauty:"مركز تجميل", atelier:"أتيليه",
    hello:"تابعنا وتواصل معنا — اضغط على أي أيقونة",
    tagline:"جمالك،<br>أولويتنا",
    lang:"English", color:"لون الإضاءة", light:["إضاءة ليلية","إضاءة نهارية"],
    facebook:["فيسبوك","تابع صفحتنا"], tiktok:["تيك توك","شاهد فيديوهاتنا"],
    whatsapp:["جروب واتساب","انضم لمجتمعنا"], vodafone:["فودافون كاش","ادفع بسهولة"],
    instapay:["إنستا باي","دفع فوري"]
  }
};

/* ----- Light colors (hue values). Add / change freely. ----- */
const COLORS = [
  { n:["Gold","ذهبي"],       h:32  },
  { n:["Rose","وردي"],       h:342 },
  { n:["Emerald","زمردي"],   h:158 },
  { n:["Ocean","أزرق"],      h:200 },
  { n:["Violet","بنفسجي"],   h:272 },
  { n:["Sunset","غروب"],     h:10  }
];

const arrowSVG = '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

const B = document.body, root = document.documentElement;
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ----- Build link cards ----- */
LINKS.forEach((l,i)=>{
  const a = document.createElement('a');
  a.className = 'link reveal';
  a.style.setProperty('--i', 8 + i);
  a.href = l.href; a.target = '_blank'; a.rel = 'noopener noreferrer';
  a.dataset.key = l.key;
  const icon = l.icon ? `<img src="${l.icon}" alt="${l.key}">` : ICONS[l.key];
  a.innerHTML = `<span class="ico">${icon}</span><span class="txt"><div class="name"></div><div class="desc"></div></span>${arrowSVG}`;
  $('links').appendChild(a);
});

/* ----- Logo ----- */
(function(){
  const box = $('logoImgs');
  if (!LOGO_SRC){ box.innerHTML = '<div class="fallback-mono"><span class="e">E</span><span class="s">S</span></div>'; return; }
  box.innerHTML = `<img class="logo-img" src="${LOGO_SRC}" alt="Esraa Syam logo"><img class="shine-img" src="${LOGO_SRC}" alt="" aria-hidden="true">`;
  box.querySelector('.logo-img').onerror = ()=>{ box.innerHTML = '<div class="fallback-mono"><span class="e">E</span><span class="s">S</span></div>'; };
})();

/* ----- Light dust ----- */
(function(){
  const s = $('sparks'); let html = '';
  for (let i=0;i<16;i++){
    const size = 2 + Math.random()*3.2, left = 4 + Math.random()*92;
    const dur = 8 + Math.random()*8, delay = -Math.random()*dur, dx = (Math.random()*80-40).toFixed(0)+'px';
    html += `<i style="left:${left}%;width:${size}px;height:${size}px;animation-duration:${dur}s;animation-delay:${delay}s;--dx:${dx}"></i>`;
  }
  s.innerHTML = html;
})();

/* ----- Language (with a soft fade) ----- */
let lang = 'en', colorIdx = 0, night = true;       // the page ALWAYS opens in dark (night) mode; the button only switches for the current visit
try{
  lang = localStorage.getItem('es_lang') || 'en';
  colorIdx = +localStorage.getItem('es_color') || 0;
}catch(e){}
B.classList.toggle('night', night);
if (!COLORS[colorIdx]) colorIdx = 0;

function applyLang(){
  const t = I18N[lang];
  document.documentElement.lang = lang;
  B.dir = lang === 'ar' ? 'rtl' : 'ltr';
  B.classList.toggle('ar', lang === 'ar');
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.innerHTML = t[el.dataset.i18n]; });
  document.querySelectorAll('.link').forEach(a=>{
    const [n,d] = t[a.dataset.key];
    a.querySelector('.name').textContent = n;
    a.querySelector('.desc').textContent = d;
  });
  $('langLabel').textContent = t.lang;
  $('colorLabel').textContent = t.color;
  $('themeLabel').textContent = t.light[night ? 1 : 0];
  document.querySelectorAll('.sw').forEach((b,i)=> b.setAttribute('aria-label', COLORS[i].n[lang==='ar'?1:0]));
  document.title = lang==='ar' ? 'إسراء سيام | مركز تجميل وأتيليه' : 'Esraa Syam | Beauty Center & Atelier';
  try{ localStorage.setItem('es_lang', lang); }catch(e){}
}
$('langBtn').onclick = ()=>{
  const card = $('card');
  card.classList.add('swap');
  setTimeout(()=>{ lang = lang==='en' ? 'ar' : 'en'; applyLang(); requestAnimationFrame(()=>card.classList.remove('swap')); }, 230);
};

/* ----- Day / Night mode (soft dip while switching) ----- */
$('themeBtn').onclick = e=>{
  e.stopPropagation();
  const swap = ()=>{
    night = !night;
    B.classList.toggle('night', night);
    $('themeLabel').textContent = I18N[lang].light[night ? 1 : 0];
  };
  if (reduce){ swap(); return; }
  const v = $('veil'); v.classList.add('show');
  setTimeout(()=>{ swap(); requestAnimationFrame(()=>requestAnimationFrame(()=>v.classList.remove('show'))); }, 270);
};

/* ----- Color palette + smooth hue tween (shortest way round the wheel) ----- */
const pal = $('palette');
COLORS.forEach((c,i)=>{
  const b = document.createElement('button');
  b.className = 'sw' + (i===colorIdx ? ' active' : '');
  b.style.setProperty('--c', c.h);
  b.onclick = e=>{ e.stopPropagation(); setColor(i); setTimeout(()=>{ pal.classList.remove('open'); colorBtn.setAttribute('aria-expanded', false); }, 380); };
  pal.appendChild(b);
});
let curHue = COLORS[colorIdx].h, raf = 0;
root.style.setProperty('--h', curHue);

function tweenHue(target){
  const d = (((target - curHue) % 360) + 540) % 360 - 180;
  const from = curHue, to = curHue + d, t0 = performance.now(), dur = reduce ? 1 : 1150;
  cancelAnimationFrame(raf);
  (function step(now){
    const p = Math.min(1, (now - t0) / dur);
    const e = p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;
    curHue = from + (to - from) * e;
    root.style.setProperty('--h', curHue.toFixed(2));
    if (p < 1) raf = requestAnimationFrame(step);
  })(t0);
}
function setColor(i, silent){
  colorIdx = i;
  document.querySelectorAll('.sw').forEach((b,k)=>b.classList.toggle('active', k===i));
  tweenHue(COLORS[i].h);
  try{ localStorage.setItem('es_color', i); }catch(e){}
  if (!silent){
    if (!B.classList.contains('on')) turnOn();
    ripple(); sway();
  }
}
function ripple(){ const w = $('wave'); w.classList.remove('go'); void w.offsetWidth; w.classList.add('go'); }

const colorBtn = $('colorBtn');
colorBtn.onclick = e=>{
  e.stopPropagation();
  const open = pal.classList.toggle('open');
  colorBtn.setAttribute('aria-expanded', open);
};
document.addEventListener('click', ()=>{ pal.classList.remove('open'); colorBtn.setAttribute('aria-expanded', false); });
document.addEventListener('keydown', e=>{ if (e.key === 'Escape') pal.classList.remove('open'); });

/* ----- Lamp: on / off ----- */
let timers = [], flick = [];
const later = (ms, fn)=> timers.push(setTimeout(fn, ms));
const clearAll = ()=>{ timers.forEach(clearTimeout); timers = []; clearFlick(); };
const clearFlick = ()=>{ flick.forEach(clearTimeout); flick = []; };
const flickAt = (ms, fn)=> flick.push(setTimeout(fn, ms));
function lampSet(on, fast){
  B.classList.toggle('fast', !!fast);
  B.classList.toggle('on', on);
  $('lampBtn').setAttribute('aria-pressed', on);
}
function turnOn(){          // a short neon-style flicker, then a warm ramp up
  clearFlick();
  lampSet(true, true);
  flickAt(90,  ()=>lampSet(false, true));
  flickAt(170, ()=>lampSet(true,  true));
  flickAt(240, ()=>lampSet(false, true));
  flickAt(330, ()=>lampSet(true,  false));
}
function turnOff(){ clearFlick(); lampSet(false, false); }
function sway(){ const s = $('swing'); s.classList.remove('sway'); void s.offsetWidth; s.classList.add('sway'); }
function tug(){ const p = $('pull'); p.classList.remove('tug'); void p.offsetWidth; p.classList.add('tug'); }

$('lampBtn').onclick = e=>{
  e.stopPropagation();
  if (!B.classList.contains('ready')){ finishIntro(); return; }
  tug(); sway();
  B.classList.contains('on') ? turnOff() : turnOn();
};

/* ----- Opening animation ----- */
function finishIntro(){
  clearAll();
  B.classList.add('in','ready');
  lampSet(true, false);
}
function intro(){
  if (reduce){ B.classList.add('in','ready'); lampSet(true, false); return; }
  later(150,  ()=> B.classList.add('in'));          // frame fades in, lamp drops
  later(1150, ()=> sway());                          // lamp swings
  later(1450, ()=> turnOn());                        // light flickers on
  later(1900, ()=>{ B.classList.add('ready'); ripple(); });  // content cascades in
  const skip = ()=>{ if (!B.classList.contains('ready')) finishIntro(); removeEventListener('pointerdown', skip); };
  addEventListener('pointerdown', skip);
}

$('yr').textContent = new Date().getFullYear();
applyLang();
intro();
</script>
